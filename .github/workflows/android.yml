name: Android CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      run_emulator_tests:
        description: Run optional emulator compatibility tests
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
      - name: Verify presentation renderer
        working-directory: tools/presentation
        run: |
          npm ci --ignore-scripts
          npm test
          npm run build
          git diff --exit-code -- ../../app/src/main/assets/presentation/renderer.js ../../app/src/main/assets/presentation/NOTICE.txt
      - uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6.3.0
        with:
          distribution: temurin
          java-version: "17"
          problem-matcher: true
      - uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd # v4.0.4
        with:
          packages: platform-tools
      - name: Install Android platforms
        run: sdkmanager "platforms;android-29" "platforms;android-37.0"
      - uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1
      - name: Verify
        run: |
          ./gradlew testDebugUnitTest lintDebug assembleDebug assembleDebugAndroidTest --console=plain
          ./gradlew assembleRelease bundleRelease -PdistributionChannel=play --console=plain
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: SeliaSheets-ci-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

  instrumentation:
    if: github.event_name == 'workflow_dispatch' && inputs.run_emulator_tests
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6.3.0
        with:
          distribution: temurin
          java-version: "17"
          problem-matcher: true
      - uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Run Android 10 instrumentation
        uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d
        with:
          api-level: 29
          target: google_apis
          arch: x86_64
          profile: pixel_4
          script: |
            adb shell getprop dalvik.vm.heapsize
            adb shell getprop dalvik.vm.heapgrowthlimit
            adb shell dumpsys webviewupdate
            sh .github/scripts/run_android_instrumentation.sh
      - name: Upload Android 10 diagnostics
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: SeliaSheets-api29-diagnostics
          if-no-files-found: warn
          path: |
            app/build/qa/primary-instrumentation/
            app/build/reports/androidTests/
            app/build/outputs/androidTest-results/

  instrumentation-api37:
    if: github.event_name == 'workflow_dispatch' && inputs.run_emulator_tests
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6.3.0
        with:
          distribution: temurin
          java-version: "17"
          problem-matcher: true
      - uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd # v4.0.4
        with:
          cmdline-tools-version: "16111833" # SDK command-line tools 23
          packages: platform-tools
      - name: Select command-line tools 23
        run: |
          mv "$ANDROID_HOME/cmdline-tools/latest" "$ANDROID_HOME/cmdline-tools/preinstalled"
          ln -s "$ANDROID_HOME/cmdline-tools/16111833" "$ANDROID_HOME/cmdline-tools/latest"
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --version
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - name: Test stylus CI coordinator
        run: python -B .github/scripts/test_run_emulator_stylus_ci.py
      - name: Install stylus CI client
        run: python -m pip install --disable-pip-version-check --require-hashes -r .github/scripts/stylus-ci-requirements.txt
      - uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1
      - name: Build APKs before emulator boot
        run: |
          sdkmanager "platforms;android-29" "platforms;android-37.0"
          ./gradlew :app:assembleDebug :app:assembleDebugAndroidTest --console=plain
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Run Android 17 instrumentation
        uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2.38.0 packaged action
        with:
          api-level: "37.0"
          target: google_apis_ps16k
          arch: x86_64
          profile: pixel_tablet
          cores: 4
          ram-size: 4096
          disk-size: 8G
          emulator-options: -no-snapshot -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -partition-size 4096 -grpc 8556 -grpc-use-token
          script: sh .github/scripts/run_android37_ci.sh
      - name: Upload Android 17 diagnostics
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: SeliaSheets-api37-diagnostics
          if-no-files-found: warn
          include-hidden-files: true
          path: |
            app/build/qa/primary-instrumentation/
            app/build/reports/androidTests/
            app/build/outputs/androidTest-results/
            ${{ runner.temp }}/seliasheets-api37/
            /tmp/android-runner/emu-crash-*.db
            /home/runner/.android/avd/test.avd/config.ini
